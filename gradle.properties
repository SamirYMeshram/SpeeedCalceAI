# Gradle performance / stability
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true

# Required: this project uses Jetpack Compose, Activity Compose, Navigation Compose,
# Lifecycle, Material 3, and Core KTX, all of which are AndroidX libraries.
android.useAndroidX=true

# Modern Android resource behavior.
android.nonTransitiveRClass=true

# Kotlin style
kotlin.code.style=official
